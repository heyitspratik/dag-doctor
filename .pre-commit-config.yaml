default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-yaml
        # Kubernetes manifests are conventionally multi-document, and Helm templates are
        # Go templates rather than YAML: they only become YAML once rendered. CI checks
        # those properly, with helm lint and kubeconform against the rendered output.
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm/[^/]+/templates/
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ruff and mypy both run from the project's own environment rather than from a pinned
  # mirror. A mirror pins a version independently of uv.lock, and two ruff versions format
  # differently, so `make check` would pass and then the commit hook would rewrite the same
  # file. One ruff, one answer, and `uv lock --upgrade` moves both at once.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        # --force-exclude because pre-commit passes filenames explicitly, and ruff ignores
        # its own exclude list for files named on the command line. Without it the hook
        # reformats alembic/versions, which pyproject deliberately leaves alone.
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        # mypy needs the project's own dependencies to resolve third-party types, and
        # checks the whole tree rather than the changed files, so it takes no filenames.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
