name: dag-doctor

# The agent's own image, shared by the three services that run it. All three carry the
# build so any one of them can produce it: a service declaring only `image:` makes compose
# try to pull `dag-doctor:local` from a registry, which fails noisily before some other
# service happens to build it, and fails outright if that service is not being started.
x-agent-image: &agent-image
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: dag-doctor:local

# Image tags are pinned and overridable. Bumping one is a single variable, which matters
# because a stale pin is the most common reason a cloned repository will not start.
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow.Dockerfile
    args:
      AIRFLOW_IMAGE_TAG: ${AIRFLOW_IMAGE_TAG:-2.10.5}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # The DAG files import the agent's callback from here rather than from an installed
    # wheel, so producer and consumer share one schema definition and cannot drift.
    PYTHONPATH: /opt/airflow/dag_doctor_src
    # The warehouse the broken DAGs read and write. Separate from both Airflow's metadata
    # database and the agent's own, because conflating them would let the agent inspect
    # its own state and call it evidence.
    AIRFLOW_CONN_WAREHOUSE: postgres://warehouse:warehouse@postgres:5432/warehouse
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    KAFKA_TOPIC_FAILURES: airflow.task.failed
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ../airflow/dags:/opt/airflow/dags:ro
    - ../airflow/seed:/opt/airflow/seed:ro
    - ../src:/opt/airflow/dag_doctor_src:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    redpanda-init:
      condition: service_completed_successfully

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: dagdoctor
      POSTGRES_PASSWORD: dagdoctor
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      # Mounted outside the init directory, not under it. Docker has to create the
      # mountpoint, and it cannot do that inside a read-only bind mount. Keeping it
      # separate also stops the entrypoint from trying to run the seed files itself:
      # 02-warehouse-schema.sh decides which of them run, and in what order.
      - ../airflow/seed:/seed:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagdoctor -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v24.2.7}
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --mode=dev-container
      # Two listeners: containers reach the broker as redpanda:9092, the host reaches it
      # as localhost:19092. One advertised address cannot be correct for both.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v24.2.7}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # A literal block, not a folded one. YAML folding keeps the newlines on lines that are
    # more indented than the first, so a folded multi-line command reaches bash as several
    # commands and every continuation flag becomes a command name.
    command:
      - |
        set -euo pipefail
        # Idempotent: re-running the stack must not fail because the topics exist.
        rpk topic create airflow.task.failed agent.diagnosis.completed airflow.task.failed.dlq \
          --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic list --brokers redpanda:9092
    restart: "no"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # A named volume by default, so a fresh clone is self-contained. Point
      # OLLAMA_MODELS at an existing store, /usr/share/ollama/.ollama on a systemd
      # install, to reuse models you have already pulled instead of downloading them
      # twice.
      - ${OLLAMA_MODELS:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    <<: *agent-image
    environment:
      POSTGRES_DSN: postgresql+psycopg://dagdoctor:dagdoctor@postgres:5432/dag_doctor
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-worker:
    <<: *agent-image
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+psycopg://dagdoctor:dagdoctor@postgres:5432/dag_doctor
      AIRFLOW_DSN: postgresql+psycopg://dagdoctor_ro:dagdoctor_ro@postgres:5432/airflow
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OLLAMA_BASE_URL: http://ollama:11434
      WAREHOUSE_DSN: postgresql+psycopg://dagdoctor_ro:dagdoctor_ro@postgres:5432/warehouse
      METRICS_PORT: 9100
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    # Must be overridden, not inherited. The image's own HEALTHCHECK probes the API on
    # 8000, and the worker serves nothing there; left alone it reports unhealthy forever
    # while consuming perfectly well. Its metrics endpoint answering is the evidence
    # available that the process is alive, which is what the Helm chart probes too.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:9100/metrics", timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  agent-api:
    <<: *agent-image
    command: ["dag-doctor-api"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      POSTGRES_DSN: postgresql+psycopg://dagdoctor:dagdoctor@postgres:5432/dag_doctor
      AIRFLOW_DSN: postgresql+psycopg://dagdoctor_ro:dagdoctor_ro@postgres:5432/airflow
      WAREHOUSE_DSN: postgresql+psycopg://dagdoctor_ro:dagdoctor_ro@postgres:5432/warehouse
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        airflow db migrate
        # Checked rather than forced with `|| true`. Creating the user has to be
        # idempotent, because `make up` runs against an existing volume, but it also has
        # to fail loudly: the REST API and the evaluation harness both authenticate as
        # this user, and a swallowed failure here surfaces much later as a 401.
        if ! airflow users list | grep -qw "${AIRFLOW_USERNAME:-airflow}"; then
          airflow users create \
            --username "${AIRFLOW_USERNAME:-airflow}" \
            --password "${AIRFLOW_PASSWORD:-airflow}" \
            --firstname Dag --lastname Doctor \
            --role Admin --email dag-doctor@example.com
        fi
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redpanda-data:
  ollama-models:
  airflow-logs:
