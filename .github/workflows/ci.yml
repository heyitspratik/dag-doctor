name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # An application, not a library: one version is all the signal a matrix would buy.
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # testcontainers starts its own Postgres, so the versions here match what the compose
    # stack runs rather than whatever a service container happened to pin.
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: Integration tests
        run: uv run pytest -m integration

  dags:
    name: Parse the seeded DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built rather than pulled, so this parses the DAGs against the image the stack
      # actually runs, and the callback's dependencies come from one place instead of
      # being restated here. The Airflow image also refuses pip as root, which a
      # `container:` job cannot avoid because the workspace needs a root checkout.
      - name: Build the Airflow image the stack uses
        run: docker build -f docker/airflow.Dockerfile -t dag-doctor-airflow:ci .

      - name: Import every DAG file
        run: |
          docker run --rm \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e PYTHONPATH=/opt/airflow/dag_doctor_src \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/airflow/seed:/opt/airflow/seed:ro" \
            -v "$PWD/src:/opt/airflow/dag_doctor_src:ro" \
            dag-doctor-airflow:ci \
            bash -c '
              airflow db migrate >/dev/null 2>&1
              python - <<PY
              from airflow.models import DagBag

              bag = DagBag("/opt/airflow/dags", include_examples=False)
              for path, error in bag.import_errors.items():
                  print(f"::error file={path}::{error}")
              if bag.import_errors:
                  raise SystemExit(1)
              print("Parsed:", ", ".join(sorted(bag.dag_ids)))
              PY
            '

  helm:
    name: Lint and render the chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint, against every values file
        run: |
          helm lint deploy/helm/dag-doctor
          helm lint deploy/helm/dag-doctor -f deploy/helm/dag-doctor/values-local.yaml
          helm lint deploy/helm/dag-doctor -f deploy/helm/dag-doctor/values-prod.yaml

      - name: Install kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      # helm lint only checks that the YAML parses and the chart follows conventions. This
      # checks the rendered manifests against the real Kubernetes API schemas, which is
      # what catches a misspelled field that would be silently ignored by the cluster.
      - name: Validate the rendered manifests
        run: |
          for values in "" \
            "-f deploy/helm/dag-doctor/values-local.yaml" \
            "-f deploy/helm/dag-doctor/values-prod.yaml"; do
            helm template dag-doctor deploy/helm/dag-doctor $values \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          kubeconform -strict -summary -kubernetes-version 1.29.0 deploy/kind/dependencies.yaml

  commit-lint:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
