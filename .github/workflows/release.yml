name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags from the git tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # arm64 is emulated here and is slow, but it is what lets the image run on an
          # Apple Silicon laptop without a second build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Publish the Helm chart
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      # The chart's appVersion follows the tag, so a chart pulled from the registry cannot
      # quietly point at an image from a different release.
      - name: Package and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/dag-doctor \
            --version "$VERSION" --app-version "$VERSION"
          helm push "dag-doctor-${VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

  release-notes:
    name: Publish the release notes
    needs: [image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generated from the conventional commit messages, which is why those messages are
      # project output rather than private notes.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
