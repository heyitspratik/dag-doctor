version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # pyproject pins requires-python to >=3.12,<3.13, so a major or minor bump of the
      # base image cannot resolve an interpreter and the build fails. Patch updates are
      # still wanted; raising the floor is a deliberate decision, not a dependency bump.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
