[project]
name = "dag-doctor"
version = "0.1.0"
description = "An autonomous agent that diagnoses failing Airflow data pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pratik Ahir" }]
keywords = ["airflow", "agent", "langgraph", "observability", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "aiokafka>=0.12",
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "pgvector>=0.3.6",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

# Airflow itself is deliberately absent. The agent reads Airflow's metadata database and
# REST API as an outsider, so it never imports the package; only the DAG files do, and
# those run inside the Airflow container.

[project.urls]
Homepage = "https://github.com/pratikahir/dag-doctor"
Repository = "https://github.com/pratikahir/dag-doctor"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,kafka]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dag_doctor"]

# Lint / format

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting through their names, and interface stubs legitimately
# ignore the arguments they are handed.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107", "ARG001", "ARG002"]
"alembic/**" = ["D", "N999"]
# Airflow DAG files are declarative and follow Airflow's own module conventions.
"airflow/dags/**" = ["D100", "D103", "ARG001"]

[tool.ruff.format]
docstring-code-format = true

# Types

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# aiokafka ships no type information. Declared once here rather than as a per-import
# ignore, so the exception is visible in one place. The Protocol in messaging/producer.py
# is what keeps the untyped client behind a checked boundary.
[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: needs real Postgres/Redpanda containers; excluded from the default run",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/dag_doctor"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
