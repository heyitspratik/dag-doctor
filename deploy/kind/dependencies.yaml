# The services the agent talks to, sized for a kind cluster.
#
# Not a production topology and not trying to be: single replicas, no persistence, no
# authentication beyond a password in plain sight. Its only job is to make
# `make kind-deploy` a real deployment rather than decorative YAML, so the chart's probes,
# migration hook and rollout behaviour are exercised against something that answers.
#
# A real cluster gets Postgres, Kafka and a model server from wherever it already gets
# them, and points the chart's values at those.
apiVersion: v1
kind: Namespace
metadata:
  name: dag-doctor
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: dag-doctor
type: Opaque
stringData:
  POSTGRES_USER: dagdoctor
  POSTGRES_PASSWORD: dagdoctor
  POSTGRES_DB: dag_doctor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dag-doctor
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres
          env:
            # The data directory has to sit below the mount point, because the emptyDir
            # arrives with a lost+found on some kernels and initdb refuses a non-empty
            # directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dagdoctor"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Deliberately ephemeral. Nothing here is worth keeping across a cluster teardown.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dag-doctor
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: dag-doctor
  labels:
    app.kubernetes.io/name: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --smp=1
            - --overprovisioned
            - --node-id=0
            - --mode=dev-container
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda.dag-doctor.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: dag-doctor
spec:
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - port: 9092
      targetPort: kafka
      name: kafka
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topics
  namespace: dag-doctor
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          command: ["/bin/bash", "-c"]
          # Idempotent, so re-running the deploy does not fail on topics that exist.
          args:
            - >
              rpk topic create airflow.task.failed agent.diagnosis.completed
              airflow.task.failed.dlq
              --brokers redpanda.dag-doctor.svc.cluster.local:9092
              --partitions 3 --replicas 1 || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: dag-doctor
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: dag-doctor
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - port: 11434
      targetPort: http
      name: http
