apiVersion: v1
kind: Service
metadata:
  name: {{ include "dag-doctor.fullname" . }}-api
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
