{{- if .Values.secrets.create }}
{{- /*
Committed defaults are for a local install only. Production should set
`secrets.create=false` and point `secrets.existingSecret` at something managed by
External Secrets, SOPS, or a cloud secret manager, so credentials never reach a values
file or git history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dag-doctor.fullname" . }}-secrets
  labels:
    {{- include "dag-doctor.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.secrets.postgresDsn | quote }}
  AIRFLOW_DSN: {{ .Values.secrets.airflowDsn | quote }}
  WAREHOUSE_DSN: {{ .Values.secrets.warehouseDsn | quote }}
  AIRFLOW_PASSWORD: {{ .Values.secrets.airflowPassword | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
