{{- if .Values.serviceMonitor.enabled }}
{{- /*
The worker and the API are separate processes with separate registries, so each is scraped
on its own port. A single ServiceMonitor would silently collect only half the metrics.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dag-doctor.fullname" . }}-worker-metrics
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.config.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dag-doctor.fullname" . }}-api
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dag-doctor.fullname" . }}-worker
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
