apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dag-doctor.fullname" . }}-api
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restarts the pods when configuration changes. Without this a values edit is
        # applied to the ConfigMap and quietly ignored by every running pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dag-doctor.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dag-doctor.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "dag-doctor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dag-doctor-api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "dag-doctor.env" . | nindent 10 }}
          # Liveness deliberately hits the endpoint that touches nothing. Pointing it at
          # readiness would turn a brief database blip into a restart loop.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              # Gives the endpoints controller time to withdraw this pod before it stops
              # serving, so a rollout does not drop requests already routed here.
              exec:
                command:
                  - /app/.venv/bin/python
                  - -c
                  - import time; time.sleep({{ .Values.api.preStopSleepSeconds }})
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "dag-doctor.writableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "dag-doctor.writableVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
