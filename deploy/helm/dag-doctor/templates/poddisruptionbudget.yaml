{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dag-doctor.fullname" . }}-api
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
---
{{- if .Values.worker.podDisruptionBudget.enabled }}
{{- /*
maxUnavailable rather than minAvailable, so a single-replica install can still be drained.
minAvailable: 1 against one replica blocks node drains entirely, which turns a routine
cluster upgrade into a manual intervention.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dag-doctor.fullname" . }}-worker
  labels:
    {{- include "dag-doctor.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.worker.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "dag-doctor.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
{{- end }}
