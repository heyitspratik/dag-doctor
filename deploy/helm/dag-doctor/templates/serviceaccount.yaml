{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dag-doctor.serviceAccountName" . }}
  labels:
    {{- include "dag-doctor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent reads Airflow and the warehouse over the network, never the Kubernetes API,
# so it has no business holding a mounted token.
automountServiceAccountToken: false
{{- end }}
